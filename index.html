<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love 💖</title>
    
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Mali:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                        cute: ['Mali', 'cursive'],
                    },
                    colors: {
                        pink: {
                            50: '#fdf2f8',
                            100: '#fce7f3',
                            200: '#fbcfe8',
                            300: '#f9a8d4',
                            400: '#f472b6',
                            500: '#ec4899',
                            600: '#db2777',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slow': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>

    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            background: linear-gradient(135deg, #fdf2f8 0%, #fbcfe8 100%);
            min-height: 100vh;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px -10px rgba(236, 72, 153, 0.25);
        }

        /* Heart Balloon Animation */
        .balloon-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            background-color: transparent;
            opacity: 0;
            animation: floatUp ease-in infinite;
        }

        .balloon svg {
            width: 100%;
            height: 100%;
            fill: #f9a8d4;
            filter: drop-shadow(0px 4px 6px rgba(236,72,153,0.4));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(-10deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-120vh) scale(1.3) rotate(30deg);
                opacity: 0;
            }
        }

        /* Slideshow Transitions */
        .slide-transition {
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
        }
        
        /* Message Box styling */
        .toast-message {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
    </style>
</head>
<body class="text-gray-800 antialiased font-sans relative">

    <!-- Heart Balloons Background Container -->
    <div class="balloon-container" id="balloonContainer"></div>

    <!-- Toast Notification (Replaces alert) -->
    <div id="toastBox" class="toast-message fixed top-5 left-1/2 transform -translate-x-1/2 -translate-y-4 opacity-0 z-50 bg-white/90 backdrop-blur border border-pink-200 text-pink-600 px-6 py-3 rounded-full shadow-lg font-medium flex items-center gap-3 pointer-events-none">
        <i class="fas fa-exclamation-circle"></i>
        <span id="toastText">Message here</span>
    </div>

    <!-- Main Content Wrapper -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4 py-8">
        
        <!-- Main Card (Narrower for Vertical Photos) -->
        <div class="glass-card rounded-[2rem] w-full max-w-md p-6 md:p-8 text-center relative overflow-hidden">
            
            <!-- Decorative corners -->
            <div class="absolute -top-8 -left-8 text-pink-200 opacity-40 text-7xl transform -rotate-12">
                <i class="fas fa-heart"></i>
            </div>
            <div class="absolute -bottom-8 -right-8 text-pink-200 opacity-40 text-7xl transform rotate-12">
                <i class="fas fa-heart"></i>
            </div>

            <!-- Header -->
            <h1 class="text-3xl md:text-4xl font-cute font-bold text-pink-500 mb-1 drop-shadow-sm animate-pulse-slow relative z-10">
                Happy Birthday! 🎂
            </h1>
            <h2 class="text-lg md:text-xl text-pink-400 font-medium mb-6 relative z-10">
                To My Everything <i class="fas fa-heart text-pink-500 animate-bounce-slow inline-block text-sm"></i>
            </h2>

            <!-- Vertical Photo Slideshow Section with Text -->
            <div class="relative w-full group mb-8 rounded-2xl overflow-hidden bg-white/40 shadow-inner border border-white p-2">
                
                <!-- The Slider Track that holds grouped [Image + Text] items -->
                <div class="overflow-hidden w-full rounded-xl">
                    <div id="sliderTrack" class="flex w-full slide-transition items-stretch">
                        <!-- Slides will be inserted here by JS -->
                    </div>
                </div>

                <!-- Navigation Controls -->
                <button onclick="prevSlide()" class="absolute left-4 top-1/3 transform -translate-y-1/2 bg-white/90 hover:bg-white text-pink-500 rounded-full w-10 h-10 flex items-center justify-center shadow-md transition duration-300 opacity-0 group-hover:opacity-100 focus:opacity-100 z-20">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button onclick="nextSlide()" class="absolute right-4 top-1/3 transform -translate-y-1/2 bg-white/90 hover:bg-white text-pink-500 rounded-full w-10 h-10 flex items-center justify-center shadow-md transition duration-300 opacity-0 group-hover:opacity-100 focus:opacity-100 z-20">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- Indicator Dots -->
            <div class="flex justify-center gap-2 mb-8" id="sliderIndicators">
                <!-- Dots will be inserted here by JS -->
            </div>

            <!-- Audio Player Section -->
            <div class="flex flex-col items-center justify-center space-y-3 relative z-10 bg-pink-50/50 p-4 rounded-2xl border border-pink-100">
                <p class="text-pink-600 font-medium text-sm">
                    🎵 เปิดเพลงประกอบความทรงจำ 🎵
                </p>
                
                <!-- Hidden Audio Element -->
                <audio id="bgm" src="BestPart.mp3" loop preload="auto" autoplay></audio>

                <!-- Custom Audio Control -->
                <button id="playBtn" onclick="toggleAudio()" class="relative flex items-center justify-center gap-2 bg-gradient-to-r from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white px-6 py-2.5 rounded-full font-medium shadow-md hover:shadow-lg transition-all duration-300">
                    <i id="playIcon" class="fas fa-play"></i>
                    <span id="playText">Play Music</span>
                    
                    <!-- Decorative music notes -->
                    <div id="musicNotes" class="absolute -top-3 right-1 text-pink-400 hidden animate-bounce-slow text-sm">
                        <i class="fas fa-music"></i>
                    </div>
                </button>
            </div>

        </div>
    </div>

    <script>
        // ----------------------------------------------------------------
        // 1. BALLOON ANIMATION LOGIC
        // ----------------------------------------------------------------
        const balloonContainer = document.getElementById('balloonContainer');
        const colors = ['#f9a8d4', '#f472b6', '#fbcfe8', '#fda4af', '#fce7f3'];
        const heartSvg = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            
            const leftPosition = Math.random() * 100;
            const animationDuration = Math.random() * 8 + 6; 
            const size = Math.random() * 30 + 20; 
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            balloon.style.left = `${leftPosition}vw`;
            balloon.style.animationDuration = `${animationDuration}s`;
            balloon.style.width = `${size}px`;
            balloon.style.height = `${size}px`;
            
            balloon.innerHTML = heartSvg;
            balloon.querySelector('svg').style.fill = color;

            balloonContainer.appendChild(balloon);

            setTimeout(() => {
                balloon.remove();
            }, animationDuration * 1000);
        }

        setInterval(createBalloon, 900);
        for(let i = 0; i < 6; i++) {
            setTimeout(createBalloon, i * 250);
        }

            },
             { 
                img: "S__21897223_0.jpg",

             {

                text: "เด็กดื้อต้องได้กินหนมหวานนนน บิงซูร้านแถวๆบ้านนั่นไง 🍧" 
            },
             { 
                img: "S__21897225_0.jpg", 
                text: "ร้านข้าวเช้าประจำของเราไง จำได้ไหม ร้านอะไรน๊าาา ติ๊กต๊อก ติ๊กต๊อกก 🍳" 
            },
             {

             {

             { 
                img: "S__21897232_0.jpg",

             {

            {

                text: "ก้าวแรกของเจ้าดื้อคนเก่งของเค้าา เป็น กลจ ให้เสมองับบ ❤️" 
            },
             { 
                img: "S__21897238_0.png", 
                text: "ไม่ว่าวันข้างหน้าจะเป็นยังไง ขอแค่มีเราจับมือกันแบบนี้ตลอดไปนะ 🤝" 
            },
            { 
                img: "https://placehold.co/600x800/ff1493/ffffff?text=I+Love+You", 
                text: "สุขสันต์วันเกิดน๊าาที่รัก เค้ารักเธอที่สุดในโลกเลยยย 🎂✨ เจ้าดื้อของเค้าา จุ้บบ ❤️" 
            }
        ];

        let currentSlide = 0;
        const track = document.getElementById('sliderTrack');
        const indicatorsContainer = document.getElementById('sliderIndicators');

        function initSlider() {
            memories.forEach((memory, index) => {
                // Create Slide Container
                const slideWrap = document.createElement('div');
                slideWrap.className = 'w-full flex-shrink-0 flex flex-col';
                
                // Image Section (Vertical Aspect Ratio 3:4)
                const imgWrap = document.createElement('div');
                imgWrap.className = 'w-full aspect-[3/4] rounded-lg overflow-hidden shadow-sm relative';
                imgWrap.innerHTML = `<img src="${memory.img}" class="w-full h-full object-cover" alt="Memory ${index + 1}">`;
                
                // Text Section (Attached below the image)
                const textWrap = document.createElement('div');
                textWrap.className = 'mt-4 px-2 min-h-[4rem] flex items-center justify-center';
                textWrap.innerHTML = `<p class="text-gray-700 font-cute text-base md:text-lg leading-relaxed text-center">${memory.text}</p>`;

                // Assemble Slide
                slideWrap.appendChild(imgWrap);
                slideWrap.appendChild(textWrap);
                track.appendChild(slideWrap);

                // Create Dot Indicator
                const dot = document.createElement('button');
                dot.className = `w-2 h-2 rounded-full transition-all duration-300 ${index === 0 ? 'bg-pink-500 w-6' : 'bg-pink-200 hover:bg-pink-400'}`;
                dot.onclick = () => goToSlide(index);
                indicatorsContainer.appendChild(dot);
            });
        }

        function updateSliderUI() {
            // Move track horizontally. Both image and text slide together.
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Update dots
            const dots = indicatorsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i === currentSlide) {
                    dots[i].className = 'w-6 h-2 rounded-full transition-all duration-300 bg-pink-500 shadow-sm';
                } else {
                    dots[i].className = 'w-2 h-2 rounded-full transition-all duration-300 bg-pink-200 hover:bg-pink-400';
                }
            }
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % memories.length;
            updateSliderUI();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + memories.length) % memories.length;
            updateSliderUI();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSliderUI();
        }

        // Auto slide every 5 seconds
        let slideInterval = setInterval(nextSlide, 5000);

        // Pause auto-slide on hover/touch
        const carousel = document.querySelector('.group');
        carousel.addEventListener('mouseenter', () => clearInterval(slideInterval));
        carousel.addEventListener('mouseleave', () => {
            slideInterval = setInterval(nextSlide, 5000);
        });
        carousel.addEventListener('touchstart', () => clearInterval(slideInterval), {passive: true});

        // Initialize Slider
        initSlider();

        // ----------------------------------------------------------------
        // 3. AUDIO & TOAST NOTIFICATION LOGIC
        // ----------------------------------------------------------------
        const bgm = document.getElementById('bgm');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');
        const musicNotes = document.getElementById('musicNotes');
        const toastBox = document.getElementById('toastBox');
        const toastText = document.getElementById('toastText');
        let isPlaying = false;

        function showToast(message) {
            toastText.innerText = message;
            toastBox.classList.remove('opacity-0', '-translate-y-4');
            toastBox.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toastBox.classList.remove('opacity-100', 'translate-y-0');
                toastBox.classList.add('opacity-0', '-translate-y-4');
            }, 3000);
        }

        function toggleAudio() {
            if (bgm.paused) {
                bgm.play().catch(error => {
                    console.log("Audio playback error:", error);
                    showToast("เบราว์เซอร์บล็อกการเล่นอัตโนมัติ กรุณากดอีกครั้ง");
                });
            } else {
                bgm.pause();
            }
        }

        // เมื่อเพลงกำลังเล่น
        bgm.addEventListener('play', () => {
            playIcon.className = 'fas fa-pause';
            playText.innerText = 'กำลังเล่นเพลง 🎶';
            playBtn.classList.add('shadow-[0_0_15px_rgba(236,72,153,0.5)]');
            musicNotes.classList.remove('hidden');
        });

        // เมื่อเพลงหยุดเล่น
        bgm.addEventListener('pause', () => {
            playIcon.className = 'fas fa-play';
            playText.innerText = 'เล่นเพลง';
            playBtn.classList.remove('shadow-[0_0_15px_rgba(236,72,153,0.5)]');
            musicNotes.classList.add('hidden');
        });

    </script>
</body>
</html>
